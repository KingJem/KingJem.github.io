<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1b30"/>
      <stop offset="1" stop-color="#132542"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>

  <!-- title -->
  <text x="112" y="176" font-size="34" font-weight="600" fill="#3ddc84" letter-spacing="4">ANDROID HTTPS CAPTURE</text>
  <text x="110" y="270" font-size="76" font-weight="800" fill="#f1f5f9">FlowTrans<tspan fill="#475569"> + </tspan><tspan fill="#e2e8f0">capture skill</tspan></text>
  <rect x="112" y="300" width="150" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="112" y="356" font-size="31" fill="#94a3b8">Transparent TUN forwarding · mitmweb decrypt · Frida SSL-unpin — one command.</text>

  <!-- pipeline -->
  <g transform="translate(0,436)" font-size="26" font-weight="600" text-anchor="middle">
    <!-- App -->
    <rect x="112" y="0" width="196" height="82" rx="16" fill="#111c30" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="43" fill="#cbd5e1">Android</text>
    <text x="210" y="70" fill="#64748b" font-size="20" font-weight="500">App</text>

    <line x1="316" y1="41" x2="372" y2="41" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- FlowTrans TUN -->
    <rect x="380" y="0" width="266" height="82" rx="16" fill="#0f2a1e" stroke="#3ddc84" stroke-width="2"/>
    <text x="513" y="43" fill="#eafff3">FlowTrans</text>
    <text x="513" y="70" fill="#3ddc84" font-size="20" font-weight="500">mihomo TUN</text>

    <line x1="654" y1="41" x2="710" y2="41" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="682" y="18" fill="#64748b" font-size="17" font-weight="500">adb reverse</text>

    <!-- mitmweb -->
    <rect x="718" y="0" width="236" height="82" rx="16" fill="#241a30" stroke="#a78bfa" stroke-width="2"/>
    <text x="836" y="43" fill="#f3e8ff">mitmweb</text>
    <text x="836" y="70" fill="#a78bfa" font-size="20" font-weight="500">decrypt · :8081</text>

    <line x1="962" y1="41" x2="1018" y2="41" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- exit -->
    <rect x="1026" y="0" width="196" height="82" rx="16" fill="#111c30" stroke="#334155" stroke-width="1.5"/>
    <text x="1124" y="43" fill="#cbd5e1">Internet</text>
    <text x="1124" y="70" fill="#64748b" font-size="20" font-weight="500">direct / overseas</text>
  </g>

  <!-- frida badge -->
  <g transform="translate(1300,150)">
    <rect x="0" y="0" width="212" height="60" rx="30" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="34" cy="30" r="10" fill="#f59e0b"/>
    <text x="58" y="38" font-size="24" font-weight="700" fill="#fbbf24">Frida unpin</text>
  </g>

  <text x="1488" y="600" text-anchor="end" font-size="22" font-weight="500" fill="#475569">github.com/KingJem</text>
</svg>
